# ============================================================
# eGlobe Review Management System
# Docker Compose — Enterprise Stack
# SQL Server 2022 + Redis + Backend + Frontend + Nginx
# ============================================================
#
# Quick start:
#   1. cp backend/.env.example backend/.env  (fill in values)
#   2. docker-compose up -d
#   3. Wait ~45s for SQL Server to initialise
#   4. Open http://localhost      (via Nginx)
#        or http://localhost:3000 (frontend direct)
#        or http://localhost:4000/api/docs (Swagger)
# ============================================================

services:

  # ── SQL Server 2022 ──────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eglobe_mssql
    restart: unless-stopped
    ports:
      - "${MSSQL_HOST_PORT:-1434}:1433"
    environment:
      SA_PASSWORD:     "${MSSQL_SA_PASSWORD:-eGlobe@StrongPass2024!}"
      ACCEPT_EULA:     "Y"
      MSSQL_PID:       "Developer"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -C 2>/dev/null || exit 1"]
      interval: 15s
      timeout:  10s
      retries:  10
      start_period: 60s
    networks:
      - eglobe_net

  # ── Redis 7 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eglobe_redis
    restart: unless-stopped
    # Expose Redis internally only to avoid host port collisions with local Redis installations
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - eglobe_net

  # ── DB Initialiser (runs once) ────────────────────────────
  db-init:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql-tools
    container_name: eglobe_db_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: "${MSSQL_SA_PASSWORD:-eGlobe@StrongPass2024!}"
    command: >
      bash -lc "
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$$SA_PASSWORD\" -N -C -Q \"IF NOT EXISTS (SELECT 1 FROM sys.databases WHERE name='eglobe_reviews') CREATE DATABASE [eglobe_reviews];\"
        echo 'Database eglobe_reviews ready'
      "
    restart: "no"
    networks:
      - eglobe_net

  # ── Express.js Backend ────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: eglobe_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: "sqlserver://sqlserver:1433;database=eglobe_reviews;user=sa;password=${MSSQL_SA_PASSWORD:-eGlobe@StrongPass2024!};encrypt=true;trustServerCertificate=true"
      REDIS_URL:    "redis://redis:6379"
      NODE_ENV:     "production"
      APP_URL:      "${APP_URL:-http://localhost}"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 30s
    networks:
      - eglobe_net

  # ── Next.js Frontend ──────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost/api}"
    container_name: eglobe_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost/api}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eglobe_net

  # ── Nginx Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: eglobe_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - eglobe_net

volumes:
  mssql_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  eglobe_net:
    driver: bridge
